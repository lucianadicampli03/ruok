<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RUOK</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f6f4ef;
      color: #111;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px 28px;
    }
    #field {
      width: min(720px, 100%);
      height: min(28vh, 200px);
      cursor: crosshair;
      display: block;
    }
    #orb { display: none; }
    .status {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #666;
      min-height: 1.2em;
      margin: 4px 0 10px;
    }
    .voices {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .voices select {
      border: 1px solid #111;
      background: #f6f4ef;
      font: inherit;
      padding: 6px 8px;
      max-width: min(360px, 70vw);
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 14px;
    }
    .pills button {
      border: 1px solid #111;
      background: #f6f4ef;
      color: #111;
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      cursor: pointer;
      animation: buzz 1.8s ease-in-out infinite;
    }
    .pills button:nth-child(2) { animation-delay: 0.2s; }
    .pills button:nth-child(3) { animation-delay: 0.4s; }
    .pills button:nth-child(4) { animation-delay: 0.6s; }
    .pills button:nth-child(5) { animation-delay: 0.8s; }
    .pills button:nth-child(6) { animation-delay: 1s; }
    .pills button:hover {
      animation: shake 0.18s linear infinite;
      background: #111;
      color: #f6f4ef;
    }
    @keyframes buzz {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      25% { transform: translate(0.4px, -0.6px) rotate(-0.4deg); }
      50% { transform: translate(-0.5px, 0.4px) rotate(0.5deg); }
      75% { transform: translate(0.3px, 0.5px) rotate(-0.2deg); }
    }
    @keyframes shake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, -2px); }
      100% { transform: translate(1px, 2px); }
    }
    .view {
      width: min(640px, 100%);
      display: none;
      margin: 0 0 12px;
      border: 1px solid #111;
      background: #111;
      position: relative;
      aspect-ratio: 16 / 10;
    }
    .view.on { display: block; }
    .view img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge {
      position: absolute; left: 10px; bottom: 10px;
      padding: 4px 8px;
      font-size: 11px;
      letter-spacing: 0.1em;
      background: #f6f4ef;
      color: #111;
    }
    .chat {
      width: min(640px, 100%);
      min-height: 72px;
      max-height: 160px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .bubble { max-width: 80%; padding: 8px 12px; font-size: 14px; line-height: 1.35; }
    .you { align-self: flex-end; background: #111; color: #f6f4ef; }
    .bot { align-self: flex-start; border: 1px solid #111; }
    .row {
      width: min(640px, 100%);
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #111;
      padding: 6px 0;
    }
    input {
      flex: 1;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 15px;
      outline: none;
      color: #111;
    }
    .icon, .go {
      border: 1px solid #111;
      background: #f6f4ef;
      color: #111;
      cursor: pointer;
      font: inherit;
      padding: 8px 14px;
    }
    .go { background: #111; color: #f6f4ef; }
    .chips {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 18px;
    }
    .chip {
      border: 1px solid #111;
      padding: 10px;
      animation: buzz 2.2s ease-in-out infinite;
    }
    .chip:nth-child(odd) { animation-delay: 0.3s; }
    .chip.on { background: #111; color: #f6f4ef; }
    .chip kbd {
      display: block;
      font-size: 10px;
      letter-spacing: 0.14em;
      font-family: inherit;
    }
    .chip b { display: block; font-size: 20px; margin-top: 4px; font-weight: 500; }
    @media (max-width: 700px) { .chips { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="field"></canvas>
    <div id="orb" class="orb"></div>
    <div id="status" class="status">move your mouse through the letters</div>
    <label class="voices">voice
      <select id="voice"></select>
    </label>
    <div class="pills">
      <button type="button" data-q="I don't have enough food">food</button>
      <button type="button" data-q="I need a safe place to stay">shelter</button>
      <button type="button" data-q="I'm not okay. Can you stay with me?">support</button>
      <button type="button" data-q="I need to report a hazard">hazard</button>
    </div>
    <div id="view" class="view">
      <img id="cam" alt="Robot camera" />
      <div id="badge" class="badge">camera</div>
    </div>
    <div id="chat" class="chat"></div>
    <form class="row" id="form">
      <button class="icon" type="button" id="mic">talk</button>
      <input id="q" autocomplete="off" placeholder="food, shelter, or if you're not okay" />
      <button class="go" type="submit">ask</button>
    </form>
    <div class="chips">
      <div class="chip" id="c-state"><kbd>STATE</kbd><b id="v-state">waiting</b></div>
      <div class="chip" id="c-us_cm"><kbd>DISTANCE</kbd><b id="v-us_cm">—</b></div>
      <div class="chip" id="c-touch"><kbd>TOUCH</kbd><b id="v-touch">no</b></div>
      <div class="chip" id="c-humidity"><kbd>HUMIDITY</kbd><b id="v-humidity">—</b></div>
      <div class="chip" id="c-temp_c"><kbd>TEMP</kbd><b id="v-temp_c">—</b></div>
      <div class="chip" id="c-rain"><kbd>RAIN</kbd><b id="v-rain">—</b></div>
    </div>
  </div>
  <script>
    const glyphs = ".,'`|:-*iIl!°·";
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");
    const mouse = { x: -9999, y: -9999 };
    let bits = [];

    function build() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const off = document.createElement("canvas");
      off.width = w;
      off.height = h;
      const o = off.getContext("2d");
      const size = Math.min(w * 0.16, 92);
      o.fillStyle = "#000";
      o.font = "700 " + size + "px Helvetica, Arial, sans-serif";
      o.textAlign = "center";
      o.textBaseline = "middle";
      o.fillText("RUOK?", w / 2, h / 2);
      const img = o.getImageData(0, 0, w, h).data;
      bits = [];
      const gap = w < 500 ? 5 : 4;
      for (let y = 0; y < h; y += gap) {
        for (let x = 0; x < w; x += gap) {
          if (img[(y * w + x) * 4 + 3] > 80) {
            bits.push({
              hx: x, hy: y, x: x, y: y, vx: 0, vy: 0,
              ch: glyphs[(x + y) % glyphs.length],
            });
          }
        }
      }
    }

    function tick() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#111";
      ctx.font = "11px ui-monospace, Menlo, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const p of bits) {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const d = Math.hypot(dx, dy) || 0.001;
        if (d < 90) {
          const f = (90 - d) / 90;
          p.vx += (dx / d) * f * 6.5;
          p.vy += (dy / d) * f * 6.5;
        }
        p.vx += (p.hx - p.x) * 0.06;
        p.vy += (p.hy - p.y) * 0.06;
        p.vx *= 0.78;
        p.vy *= 0.78;
        p.x += p.vx;
        p.y += p.vy;
        ctx.fillText(p.ch, p.x, p.y);
      }
      requestAnimationFrame(tick);
    }

    canvas.addEventListener("mousemove", (e) => {
      const r = canvas.getBoundingClientRect();
      mouse.x = e.clientX - r.left;
      mouse.y = e.clientY - r.top;
    });
    canvas.addEventListener("mouseleave", () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener("resize", build);
    build();
    tick();

    const chat = document.getElementById("chat");
    const orb = document.getElementById("orb");
    const status = document.getElementById("status");
    const q = document.getElementById("q");

    function bubble(who, text) {
      const d = document.createElement("div");
      d.className = "bubble " + who;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }
    function setChip(id, value) {
      const el = document.getElementById("v-" + id);
      if (el) el.textContent = value;
    }
    function flash(keys) {
      document.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
      (keys || []).forEach((k) => {
        const c = document.getElementById("c-" + k);
        if (c) c.classList.add("on");
      });
    }
    async function poll() {
      try {
        const s = await (await fetch("/api/state")).json();
        const mode = s.state || "waiting";
        setChip("state", mode);
        setChip("us_cm", s.us_cm >= 0 ? s.us_cm + " cm" : "—");
        setChip("touch", s.touch ? "yes" : "no");
        setChip("humidity", s.humidity >= 0 ? s.humidity.toFixed(0) + "%" : "—");
        setChip("temp_c", s.temp_c >= 0 ? s.temp_c.toFixed(0) + "°" : "—");
        setChip("rain", s.wet ? "wet" : "dry");
        const line = {
          waiting: "waiting  ·  over 120 cm",
          approaching: "approaching  ·  25 to 120 cm",
          stopped: "stopped  ·  25 cm or closer, or touch",
        };
        status.textContent = line[mode] || mode;
        const view = document.getElementById("view");
        const cam = document.getElementById("cam");
        const badge = document.getElementById("badge");
        if (s.has_camera) {
          view.classList.add("on");
          cam.src = "/api/frame.jpg?t=" + Date.now();
          badge.textContent = s.person ? "person" : "no person";
          badge.className = "badge" + (s.person ? " yes" : "");
        } else view.classList.remove("on");
      } catch (e) {}
    }
    const voiceSel = document.getElementById("voice");
    function fillVoices() {
      const all = speechSynthesis.getVoices();
      if (!all.length) return;
      const keep = voiceSel.value;
      voiceSel.innerHTML = "";
      all.forEach((v, i) => {
        const o = document.createElement("option");
        o.value = i;
        o.textContent = v.name + (v.lang ? " (" + v.lang + ")" : "");
        voiceSel.appendChild(o);
      });
      const boy = all.findIndex((v) => /bryan|brian/i.test(v.name));
      const male = all.findIndex((v) => /male|daniel|david|alex|fred|tom|guy|boy|james|mark/i.test(v.name));
      if (keep) voiceSel.value = keep;
      else if (boy >= 0) voiceSel.value = String(boy);
      else if (male >= 0) voiceSel.value = String(male);
    }
    fillVoices();
    speechSynthesis.onvoiceschanged = fillVoices;

    let followTimer = null;
    function talk(text, after) {
      if (!window.speechSynthesis || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const pick = speechSynthesis.getVoices()[Number(voiceSel.value)];
      if (pick) u.voice = pick;
      u.rate = 0.95;
      u.pitch = 0.85;
      u.onend = () => {
        orb.className = "orb";
        if (after) after();
      };
      window.speechSynthesis.speak(u);
    }
    async function ask(text) {
      if (!text) return;
      if (followTimer) { clearTimeout(followTimer); followTimer = null; }
      bubble("you", text);
      q.value = "";
      orb.className = "orb listen";
      const res = await (await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, client_tts: true }),
      })).json();
      bubble("bot", res.reply);
      flash(res.highlight);
      orb.className = "orb talk";
      talk(res.reply, () => {
        if (!res.followup) return;
        followTimer = setTimeout(() => {
          bubble("bot", res.followup);
          orb.className = "orb talk";
          talk(res.followup);
        }, res.followup_ms || 5000);
      });
    }
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      ask(q.value);
    });
    document.querySelectorAll(".pills button").forEach((b) => {
      b.addEventListener("click", () => ask(b.dataset.q));
    });
    document.getElementById("mic").addEventListener("click", () => {
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!R) { q.placeholder = "type it — no mic in this browser"; return; }
      const rec = new R();
      rec.lang = "en-US";
      rec.onresult = (ev) => ask(ev.results[0][0].transcript);
      rec.start();
    });
    const HELLO = "Hello, I am RUOK. Can I help you?";
    function greet() {
      if (chat.dataset.greeted) return;
      chat.dataset.greeted = "1";
      bubble("bot", HELLO);
      orb.className = "orb talk";
      talk(HELLO);
    }
    setInterval(poll, 400);
    poll();
    fillVoices();
    setTimeout(greet, 400);
  </script>
</body>
</html>
