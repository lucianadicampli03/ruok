<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RUOK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f6f3ec;
      --mute: #b7b3c8;
      --glass: rgba(18, 16, 32, 0.55);
      --line: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: Outfit, system-ui, sans-serif;
      background: #07060d;
    }
    body {
      background:
        radial-gradient(900px 500px at 50% -10%, #3d2a78 0%, transparent 55%),
        radial-gradient(700px 420px at 100% 80%, #123b4a 0%, transparent 50%),
        radial-gradient(600px 380px at 0% 90%, #4a1d3a 0%, transparent 48%),
        #07060d;
    }
    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 880px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 28px 20px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.28em;
      font-size: 12px;
      font-weight: 600;
      color: #d8d2ea;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #8ee4c1;
      box-shadow: 0 0 12px #8ee4c1;
    }
    .title {
      margin: 10px 0 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(36px, 6vw, 58px);
      font-weight: 400;
      letter-spacing: -0.03em;
    }
    .title em { font-style: italic; color: #e8d6ff; }
    .view {
      width: min(640px, 100%);
      display: none;
      margin: 8px 0 14px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #0c0a14;
      position: relative;
      aspect-ratio: 16 / 10;
    }
    .view.on { display: block; }
    .view img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .badge {
      position: absolute; left: 12px; bottom: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      background: rgba(8, 8, 14, 0.7);
      border: 1px solid var(--line);
    }
    .badge.yes { color: #8ee4c1; }
    .stage {
      position: relative;
      width: 220px; height: 220px;
      margin: 18px 0 8px;
    }
    .halo, .orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }
    .halo {
      background: conic-gradient(from 200deg, #7aa7ff, #e2a6ff, #7ee8c8, #7aa7ff);
      filter: blur(18px);
      opacity: 0.55;
      animation: spin 10s linear infinite;
    }
    .orb {
      inset: 22px;
      background:
        radial-gradient(circle at 32% 28%, #ffffffcc, transparent 36%),
        conic-gradient(from 140deg, #6b9dff, #d9a4ff, #6fe3c4, #6b9dff);
      box-shadow: inset 0 0 40px rgba(255,255,255,0.25), 0 20px 50px rgba(80, 60, 160, 0.35);
      animation: idle 5s ease-in-out infinite;
    }
    .orb.listen { animation: listen 1.2s ease-in-out infinite; }
    .orb.talk { animation: talk 0.9s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes idle { 50% { transform: scale(1.03); } }
    @keyframes listen { 50% { transform: scale(1.08); filter: saturate(1.25); } }
    @keyframes talk { 50% { transform: scale(1.12); } }
    .status {
      color: var(--mute);
      font-size: 14px;
      min-height: 1.3em;
      margin-bottom: 14px;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .pills button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .pills button:hover { background: rgba(255,255,255,0.1); }
    .chat {
      width: min(640px, 100%);
      flex: 1;
      min-height: 150px;
      max-height: 280px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 2px 16px;
    }
    .chat:empty::after {
      content: "Say hey. I’ll ask if you’re okay — or ask me the weather.";
      color: #8d89a3;
      text-align: center;
      margin: auto;
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-size: 20px;
    }
    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 22px;
      line-height: 1.4;
      font-size: 16px;
    }
    .you {
      align-self: flex-end;
      background: linear-gradient(180deg, #5b7dff, #4a5fd4);
    }
    .bot {
      align-self: flex-start;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .row {
      width: min(640px, 100%);
      display: flex;
      gap: 10px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(12, 10, 22, 0.65);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    input {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      padding: 10px 14px;
      outline: none;
    }
    .icon, .go {
      width: 46px; height: 46px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }
    .icon {
      background: rgba(255,255,255,0.08);
      color: var(--ink);
      font-size: 18px;
    }
    .go { background: #f6f3ec; color: #161221; }
    .chips {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 22px;
    }
    .chip {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 10px 14px;
      text-align: left;
      backdrop-filter: blur(10px);
      transition: border-color .2s, transform .2s, background .2s;
    }
    .chip.on {
      border-color: #c9b6ff;
      background: rgba(180, 150, 255, 0.12);
      transform: translateY(-3px);
    }
    .chip kbd {
      display: block;
      color: #9b97ad;
      font-size: 10px;
      letter-spacing: 0.14em;
      font-family: inherit;
    }
    .chip b { display: block; font-size: 22px; margin-top: 6px; font-weight: 500; }
    @media (max-width: 700px) {
      .chips { grid-template-columns: repeat(2, 1fr); }
      .stage { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="wrap">
    <div class="brand"><span class="dot"></span> RUOK</div>
    <h1 class="title">are you <em>okay?</em></h1>
    <div class="stage">
      <div class="halo"></div>
      <div id="orb" class="orb"></div>
    </div>
    <div id="view" class="view">
      <img id="cam" alt="Robot camera" />
      <div id="badge" class="badge">camera</div>
    </div>
    <div id="status" class="status">listening to the robot…</div>
    <div class="pills">
      <button type="button" data-q="what's the humidity?">humidity</button>
      <button type="button" data-q="how's the weather?">weather</button>
      <button type="button" data-q="I need food">food</button>
      <button type="button" data-q="I need shelter">shelter</button>
    </div>
    <div id="chat" class="chat"></div>
    <form class="row" id="form">
      <button class="icon" type="button" id="mic" title="Talk">●</button>
      <input id="q" autocomplete="off" placeholder="Ask the weather, or what you need…" />
      <button class="go" type="submit">ask</button>
    </form>
    <div class="chips">
      <div class="chip" id="c-humidity"><kbd>HUMIDITY</kbd><b id="v-humidity">—</b></div>
      <div class="chip" id="c-temp_c"><kbd>TEMP</kbd><b id="v-temp_c">—</b></div>
      <div class="chip" id="c-rain"><kbd>RAIN</kbd><b id="v-rain">—</b></div>
      <div class="chip" id="c-light"><kbd>LIGHT</kbd><b id="v-light">—</b></div>
      <div class="chip" id="c-us_cm"><kbd>DISTANCE</kbd><b id="v-us_cm">—</b></div>
      <div class="chip" id="c-pir"><kbd>MOTION</kbd><b id="v-pir">—</b></div>
      <div class="chip" id="c-vibe"><kbd>SHAKE</kbd><b id="v-vibe">—</b></div>
      <div class="chip" id="c-state"><kbd>STATE</kbd><b id="v-state">idle</b></div>
    </div>
  </div>
  <script>
    const chat = document.getElementById("chat");
    const orb = document.getElementById("orb");
    const status = document.getElementById("status");
    const q = document.getElementById("q");

    function bubble(who, text) {
      const d = document.createElement("div");
      d.className = "bubble " + who;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    function setChip(id, value) {
      const el = document.getElementById("v-" + id);
      if (el) el.textContent = value;
    }

    function flash(keys) {
      document.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
      (keys || []).forEach((k) => {
        const c = document.getElementById("c-" + k);
        if (c) c.classList.add("on");
      });
    }

    async function poll() {
      try {
        const s = await (await fetch("/api/state")).json();
        setChip("humidity", s.humidity >= 0 ? s.humidity.toFixed(0) + "%" : "—");
        setChip("temp_c", s.temp_c >= 0 ? s.temp_c.toFixed(0) + "°" : "—");
        setChip("rain", s.wet ? "wet" : "dry");
        setChip("light", s.dark ? "dark" : "bright");
        setChip("us_cm", s.us_cm >= 0 ? s.us_cm + " cm" : "—");
        setChip("pir", s.someone ? "yes" : "no");
        setChip("vibe", s.jostled ? "yes" : "no");
        setChip("state", s.state || "idle");
        status.textContent = (s.voice || "voice") + (s.place ? " · " + s.place : " · ask from the sensors");
        const view = document.getElementById("view");
        const cam = document.getElementById("cam");
        const badge = document.getElementById("badge");
        if (s.has_camera) {
          view.classList.add("on");
          cam.src = "/api/frame.jpg?t=" + Date.now();
          badge.textContent = s.person ? "person" : "no person";
          badge.className = "badge" + (s.person ? " yes" : "");
        } else {
          view.classList.remove("on");
        }
      } catch (e) {}
    }

    function talk(text) {
      if (!window.speechSynthesis || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      u.pitch = 1.05;
      u.onend = () => { orb.className = "orb"; };
      window.speechSynthesis.speak(u);
    }

    async function ask(text) {
      if (!text) return;
      bubble("you", text);
      q.value = "";
      orb.className = "orb listen";
      const res = await (await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, client_tts: true }),
      })).json();
      bubble("bot", res.reply);
      flash(res.highlight);
      orb.className = "orb talk";
      talk(res.reply);
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      ask(q.value);
    });
    document.querySelectorAll(".pills button").forEach((b) => {
      b.addEventListener("click", () => ask(b.dataset.q));
    });
    document.getElementById("mic").addEventListener("click", () => {
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!R) { q.placeholder = "Type it — this browser has no mic speech"; return; }
      const rec = new R();
      rec.lang = "en-US";
      rec.onresult = (ev) => ask(ev.results[0][0].transcript);
      rec.start();
      orb.className = "orb listen";
    });

    setInterval(poll, 400);
    poll();
  </script>
</body>
</html>
