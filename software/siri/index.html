<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RUOK</title>
  <style>
    :root {
      --bg: #07080c;
      --card: #12141c;
      --ink: #f4f1ea;
      --mute: #9aa3b2;
      --accent: #7eb8ff;
      --good: #8ee4af;
      --hot: #ffc27a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: radial-gradient(ellipse at 50% 20%, #1a2240 0%, var(--bg) 55%);
      color: var(--ink);
      font-family: "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 40px;
    }
    h1 { margin: 0; font-weight: 600; letter-spacing: 0.08em; font-size: 14px; color: var(--mute); }
    .orb {
      width: 168px; height: 168px; border-radius: 50%;
      margin: 28px 0 12px;
      background: conic-gradient(from 120deg, #6aa6ff, #c7a6ff, #7ee0c7, #6aa6ff);
      filter: blur(0);
      box-shadow: 0 0 60px #6aa6ff66, inset 0 0 40px #ffffff33;
      animation: idle 6s ease-in-out infinite;
      position: relative;
    }
    .orb.talk { animation: talk 1.1s ease-in-out infinite; }
    .orb.listen { animation: listen 1.4s ease-in-out infinite; }
    .orb::after {
      content: "";
      position: absolute; inset: 14px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff55, #0b1020 70%);
    }
    @keyframes idle { 50% { transform: scale(1.04); } }
    @keyframes talk { 50% { transform: scale(1.12); filter: saturate(1.3); } }
    @keyframes listen { 50% { transform: scale(1.08); box-shadow: 0 0 80px #7ee0c788; } }
    .status { color: var(--mute); min-height: 1.4em; margin-bottom: 18px; }
    .chat {
      width: min(560px, 100%);
      display: flex; flex-direction: column; gap: 10px;
      min-height: 160px; margin-bottom: 18px;
    }
    .bubble {
      max-width: 86%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.35;
      font-size: 17px;
    }
    .you { align-self: flex-end; background: #2a3348; }
    .bot { align-self: flex-start; background: #1c2436; border: 1px solid #2d3a58; }
    .row {
      display: flex; gap: 10px; width: min(560px, 100%);
    }
    input {
      flex: 1; border: 0; border-radius: 999px;
      padding: 14px 18px; font-size: 16px;
      background: var(--card); color: var(--ink); outline: none;
    }
    button {
      border: 0; border-radius: 999px; padding: 0 18px;
      background: var(--accent); color: #081018; font-weight: 700; cursor: pointer;
    }
    button.mic { background: #2a3348; color: var(--ink); }
    .chips {
      width: min(720px, 100%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 22px;
    }
    .chip {
      background: var(--card);
      border: 1px solid #232838;
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
      transition: border-color .2s, transform .2s;
    }
    .chip.on { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px #7eb8ff22; }
    .chip kbd { display: block; color: var(--mute); font-size: 11px; letter-spacing: .06em; }
    .chip b { display: block; font-size: 20px; margin-top: 4px; }
    .hints { margin-top: 16px; color: var(--mute); font-size: 13px; }
    @media (max-width: 640px) { .chips { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>RUOK</h1>
    <div id="orb" class="orb"></div>
    <div id="status" class="status">listening to the robot…</div>
    <div id="chat" class="chat"></div>
    <form class="row" id="form">
      <input id="q" autocomplete="off" placeholder="Ask the weather, humidity, or what you need…" />
      <button class="mic" type="button" id="mic">talk</button>
      <button type="submit">ask</button>
    </form>
    <div class="chips">
      <div class="chip" id="c-humidity"><kbd>HUMIDITY</kbd><b id="v-humidity">—</b></div>
      <div class="chip" id="c-temp_c"><kbd>TEMP</kbd><b id="v-temp_c">—</b></div>
      <div class="chip" id="c-rain"><kbd>RAIN</kbd><b id="v-rain">—</b></div>
      <div class="chip" id="c-light"><kbd>LIGHT</kbd><b id="v-light">—</b></div>
      <div class="chip" id="c-us_cm"><kbd>DISTANCE</kbd><b id="v-us_cm">—</b></div>
      <div class="chip" id="c-pir"><kbd>MOTION</kbd><b id="v-pir">—</b></div>
      <div class="chip" id="c-vibe"><kbd>SHAKE</kbd><b id="v-vibe">—</b></div>
      <div class="chip" id="c-state"><kbd>STATE</kbd><b id="v-state">idle</b></div>
    </div>
    <div class="hints">Tap mic and talk, or type. RUOK talks back. Try “what’s the humidity?”</div>
  </div>
  <script>
    const chat = document.getElementById("chat");
    const orb = document.getElementById("orb");
    const status = document.getElementById("status");
    const q = document.getElementById("q");

    function bubble(who, text) {
      const d = document.createElement("div");
      d.className = "bubble " + who;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    function setChip(id, value) {
      const el = document.getElementById("v-" + id);
      if (el) el.textContent = value;
    }

    function flash(keys) {
      document.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
      (keys || []).forEach((k) => {
        const c = document.getElementById("c-" + k);
        if (c) c.classList.add("on");
      });
    }

    async function poll() {
      try {
        const s = await (await fetch("/api/state")).json();
        setChip("humidity", s.humidity >= 0 ? s.humidity.toFixed(0) + "%" : "—");
        setChip("temp_c", s.temp_c >= 0 ? s.temp_c.toFixed(0) + "°" : "—");
        setChip("rain", s.wet ? "wet" : "dry");
        setChip("light", s.dark ? "dark" : "bright");
        setChip("us_cm", s.us_cm >= 0 ? s.us_cm + " cm" : "—");
        setChip("pir", s.someone ? "yes" : "no");
        setChip("vibe", s.jostled ? "yes" : "no");
        setChip("state", s.state || "idle");
        status.textContent = s.voice + " · " + (s.place || "ask me anything from the sensors");
      } catch (e) {}
    }

    function talk(text) {
      if (!window.speechSynthesis || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      u.pitch = 1.05;
      u.onend = () => { orb.className = "orb"; };
      window.speechSynthesis.speak(u);
    }

    async function ask(text) {
      if (!text) return;
      bubble("you", text);
      q.value = "";
      orb.className = "orb listen";
      const res = await (await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, client_tts: true }),
      })).json();
      bubble("bot", res.reply);
      flash(res.highlight);
      orb.className = "orb talk";
      talk(res.reply);
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      ask(q.value);
    });

    document.getElementById("mic").addEventListener("click", () => {
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!R) { q.placeholder = "Type it — this browser has no mic speech"; return; }
      const rec = new R();
      rec.lang = "en-US";
      rec.onresult = (ev) => ask(ev.results[0][0].transcript);
      rec.start();
      orb.className = "orb listen";
    });

    setInterval(poll, 400);
    poll();
  </script>
</body>
</html>
